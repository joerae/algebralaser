<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="broom-handle" x1="10" y1="10" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="broom-bristles" x1="28" y1="28" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="broom-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Handle -->
  <path d="M7 8 L29 30" stroke="url(#broom-handle)" stroke-width="4" stroke-linecap="round" />
  <!-- Twig bristle brush -->
  <path d="M28 29 C29 27, 33 27, 36 29 L42 41 C40 43, 34 44, 30 40 L28 29 Z" fill="url(#broom-bristles)" filter="url(#broom-glow)" />
  <!-- Gold wire band -->
  <line x1="28" y1="31" x2="33" y2="28" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
  <line x1="30" y1="33" x2="35" y2="30" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
  <!-- Magical flight trails -->
  <circle cx="8" cy="18" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="14" cy="26" r="1" fill="#facc15" opacity="0.8" />
  <circle cx="21" cy="38" r="1.2" fill="#c084fc" opacity="0.8" />
</svg>
