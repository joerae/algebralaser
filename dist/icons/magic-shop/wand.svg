<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="wand-handle" x1="8" y1="40" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#472605" />
      <stop offset="50%" stop-color="#8b5a2b" />
      <stop offset="100%" stop-color="#d4a373" />
    </linearGradient>
    <linearGradient id="wand-tip" x1="28" y1="20" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="wand-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Wand Shaft -->
  <path d="M9 39 L31 17" stroke="url(#wand-handle)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M8 40 L12 36" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <!-- Magical Glowing Tip -->
  <path d="M31 17 L38 10" stroke="url(#wand-tip)" stroke-width="5" stroke-linecap="round" filter="url(#wand-glow)" />
  <!-- Sparkles & Magic Star -->
  <path d="M38 10 L39 6 L40 10 L44 11 L40 12 L39 16 L38 12 L34 11 Z" fill="#fef08a" filter="url(#wand-glow)" />
  <circle cx="28" cy="8" r="1.5" fill="#67e8f9" filter="url(#wand-glow)" />
  <circle cx="43" cy="18" r="1" fill="#f472b6" filter="url(#wand-glow)" />
  <circle cx="33" cy="22" r="1" fill="#a78bfa" filter="url(#wand-glow)" />
</svg>
