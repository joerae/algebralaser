<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="cauldron-body" x1="12" y1="18" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="potion-glow" x1="16" y1="18" x2="32" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <filter id="brew-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Feet -->
  <path d="M16 38 L14 43 M32 38 L34 43 M24 39 L24 44" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <!-- Cauldron Belly -->
  <path d="M11 20 C10 32, 16 39, 24 39 C32 39, 38 32, 37 20 Z" fill="url(#cauldron-body)" stroke="#475569" stroke-width="1.5" />
  <!-- Rim -->
  <ellipse cx="24" cy="20" rx="14" ry="3.5" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <!-- Bubbling potion liquid -->
  <ellipse cx="24" cy="20" rx="11" ry="2.5" fill="url(#potion-glow)" filter="url(#brew-blur)" />
  <!-- Bubbles rising -->
  <circle cx="21" cy="14" r="2" fill="#4ade80" filter="url(#brew-blur)" />
  <circle cx="27" cy="11" r="2.5" fill="#86efac" filter="url(#brew-blur)" />
  <circle cx="18" cy="10" r="1.5" fill="#22c55e" filter="url(#brew-blur)" />
  <circle cx="31" cy="15" r="1.2" fill="#4ade80" filter="url(#brew-blur)" />
</svg>
