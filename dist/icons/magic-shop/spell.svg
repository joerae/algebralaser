<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scroll-paper" x1="10" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="scroll-ends" x1="8" y1="10" x2="8" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="rune-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rolled parchment body -->
  <rect x="12" y="10" width="24" height="28" rx="2" fill="url(#scroll-paper)" stroke="#d97706" stroke-width="1.5" />
  <!-- Top & bottom wooden/rolled spindle ends -->
  <rect x="9" y="8" width="30" height="5" rx="2.5" fill="url(#scroll-ends)" stroke="#78350f" stroke-width="1" />
  <rect x="9" y="35" width="30" height="5" rx="2.5" fill="url(#scroll-ends)" stroke="#78350f" stroke-width="1" />
  <!-- Arcane Glowing Rune -->
  <path d="M24 16 L29 23 L25 24 L28 30 L20 23 L24 22 Z" fill="#818cf8" stroke="#4f46e5" stroke-width="1" filter="url(#rune-glow)" />
  <!-- Ribbon tie -->
  <line x1="12" y1="24" x2="36" y2="24" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="4 2" />
  <!-- Sparkles -->
  <circle cx="34" cy="18" r="1.5" fill="#a855f7" filter="url(#rune-glow)" />
  <circle cx="15" cy="30" r="1.2" fill="#38bdf8" filter="url(#rune-glow)" />
</svg>
