<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Finger Algebra — Laser Hand Tracking</title>
  <meta name="description" content="A magical browser game where you rearrange and solve linear equations using a laser beam from your index finger via webcam hand tracking." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DXRnqiq6.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BQ4mP1wH.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas-overlay"></canvas>
    <header id="hud-header" class="hud-header"></header>

    <main class="stage-container">
      <aside id="forge-panel" class="forge-panel" aria-label="Forge the opposite" style="display: none;"></aside>
      <aside id="blaster-panel" class="blaster-panel" aria-label="Inverse blasters" style="display: none;"></aside>
      <aside id="inverse-panel" class="inverse-panel" aria-label="Blast it away" style="display: none;"></aside>

      <div class="workspace-center">
        <section id="story-area" class="story-area"></section>
        <section id="equation-area" class="equation-area" aria-label="Equation workspace"></section>

        <div id="camera-box" class="camera-box">
          <div class="camera-box-header">
            <div class="camera-header-left">
              <span id="camera-status-dot" class="camera-status-dot"></span>
              <span class="camera-title">Laser Hand Tracker</span>
            </div>
            <div class="camera-header-right">
              <button id="btn-camera-size" class="camera-size-btn" title="Toggle camera size (2x Large / 1x Standard)">
                <span class="size-icon">⛶</span>
                <span id="camera-size-label" class="size-label">2x View</span>
              </button>
              <span id="camera-hint-badge" class="camera-hint-badge">Point up at equation ☝️</span>
            </div>
          </div>
          <div id="camera-feed-container" class="camera-feed-container">
            <video id="webcam-video" playsinline muted autoplay></video>
            <div id="camera-placeholder" class="camera-placeholder">
              <div class="placeholder-icon">📷</div>
              <div class="placeholder-title">Webcam Inactive</div>
              <div class="placeholder-subtitle">Click "Enable Camera" above to shine your finger laser, or play with mouse.</div>
            </div>
          </div>
        </div>
      </div>

      <aside id="story-choices-column" class="story-choices-column answers-column" aria-label="Equation choices" style="display: none;"></aside>
      <aside id="answers-column" class="answers-column" aria-label="Arithmetic answers" style="display: none;"></aside>
    </main>

    <footer id="hud-footer" class="hud-footer"></footer>

    <div id="carried-bubble" class="carried-bubble" style="display: none;">
      <svg class="bubble-progress-ring" viewBox="0 0 100 100">
        <circle class="bubble-ring-track" cx="50" cy="50" r="45"></circle>
        <circle class="bubble-ring-fill" cx="50" cy="50" r="45"
          stroke-dasharray="283"
          stroke-dashoffset="283"></circle>
      </svg>
      <span class="bubble-term"></span>
      <div class="bubble-twin" aria-hidden="true"><span class="bubble-twin-term"></span></div>
      <span class="bubble-caption"></span>
    </div>
    <div id="split-bubble-left" class="carried-bubble split-clone" style="display: none;">
      <span class="bubble-term"></span>
    </div>
    <div id="split-bubble-right" class="carried-bubble split-clone" style="display: none;">
      <span class="bubble-term"></span>
    </div>
    <svg id="equation-arrow-svg" class="equation-arrow-svg" style="display: none;">
      <defs>
        <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
        </linearGradient>
        <filter id="arrow-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <marker id="arrow-head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 2 2 L 10 6 L 2 10 z" fill="#38bdf8" />
        </marker>
      </defs>
      <path id="connector-arrow-path" class="connector-arrow-path" d="" marker-end="url(#arrow-head)" />
    </svg>
    <div id="camera-banner" class="camera-prompt-banner" style="display: none;"></div>
    <div id="settings-modal" class="modal-backdrop" style="display: none;"></div>
    <div id="debug-overlay" class="debug-overlay" style="display: none;"></div>
  </div>

</body>
</html>
